# FDA-Compliant Validation Configuration
# Document Control: VC-2024-001 Rev 2.0
# Implements Verification & Validation Protocol per FDA 21 CFR 820.30(f)(g)

# ---- Performance Thresholds ---- #
# Predetermined acceptance criteria from Design Input
performance_thresholds:
  auc_roc: 0.85
  sensitivity: 0.80
  specificity: 0.85
  ppv: 0.30
  npv: 0.98
  average_precision: 0.50

# ---- Statistical Testing ---- #
statistical_testing:
  significance_level: 0.05
  non_inferiority:
    margin: 0.05
    one_sided_alpha: 0.025
    n_bootstrap: 2000
  equivalence:
    margin: 0.10
    alpha: 0.05
  confidence_intervals:
    method: "bootstrap_bca"
    n_bootstrap: 2000
    confidence_level: 0.95

# ---- Predicate Device Performance ---- #
# Reference performance for non-inferiority testing
predicate_performance:
  auc_roc: 0.85
  sensitivity: 0.82
  specificity: 0.87
  device_name: "PredCAD v2.0"
  clearance_number: "K123456"

# ---- Subgroup Analysis ---- #
subgroups:
  age_group:
    - "40-49"
    - "50-59"
    - "60-69"
    - "70+"
  breast_density:
    - "A-fatty"
    - "B-scattered"
    - "C-heterogeneous"
    - "D-dense"
  race_ethnicity:
    - "White"
    - "Black"
    - "Asian"
    - "Hispanic"
    - "Other"
  scanner_manufacturer:
    - "Hologic"
    - "GE"
    - "Siemens"
    - "Fujifilm"

subgroup_analysis:
  min_subgroup_size: 50
  subgroup_auc_threshold_offset: 0.05  # Overall threshold - this
  multiple_comparison_correction: "bonferroni"

# ---- Bias Detection Thresholds ---- #
bias_thresholds:
  max_equalized_odds_difference: 0.10
  max_demographic_parity_difference: 0.10
  max_calibration_difference: 0.05
  max_predictive_parity_difference: 0.10

# ---- Intersectional Analysis ---- #
intersectional_groups:
  - ["age_group", "race_ethnicity"]
  - ["breast_density", "scanner_manufacturer"]
  - ["age_group", "breast_density"]

# ---- Regression Testing ---- #
regression_testing:
  regression_threshold: 0.02  # Minimum meaningful change
  alpha: 0.05
  n_bootstrap: 2000
  edge_case_tests:
    - "extreme_high_confidence"
    - "near_threshold_concentration"
    - "score_distribution_reasonableness"
    - "monotonic_calibration"
    - "operating_point_stability"

# ---- Calibration ---- #
calibration:
  method: "isotonic"
  n_bins: 10
  max_expected_calibration_error: 0.05

# ---- Operating Point Selection ---- #
operating_point:
  method: "youden_index"  # Maximizes sensitivity + specificity - 1
  constraints:
    min_sensitivity: 0.80
    min_specificity: 0.85
  alternative_thresholds:
    high_sensitivity: 0.90  # For screening
    high_specificity: 0.95  # For confirmatory
